<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BART Live</title>
<style>
  :root{
    --bg:#ffffff;
    --ink:#20201c;
    --muted:#8d8a80;
    --card:#ffffff;
    --shadow: 0 1px 2px rgba(20,20,20,.06), 0 6px 20px rgba(20,20,20,.10);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;height:100dvh;height:calc(var(--vh, 1vh) * 100);background:var(--bg);overflow:hidden;-webkit-tap-highlight-color:transparent;}
  body{color:var(--ink);}
  #app{position:fixed;inset:0;}
  #mapWrap{position:absolute;inset:0;touch-action:none;cursor:grab;}
  #mapWrap.dragging{cursor:grabbing;}
  svg#map{width:100%;height:100%;display:block;background:var(--bg);}

  .line-path{fill:none;stroke-linecap:round;stroke-linejoin:round;transition:opacity .25s ease;}
  .line-path.dimmed{opacity:.10;}
  .station-dot.dimmed{opacity:.15;}
  .station-label.dimmed{opacity:.15;}


  .station-dot, .station-dot-inner{ display:none; }
  .lod-city .station-dot, .lod-detail .station-dot, .lod-city .station-dot-inner, .lod-detail .station-dot-inner{ display:block; }
  .regular-dot{ fill:#fff; stroke:#1a1a1a; }
  .station-hit{fill:transparent; cursor:pointer; pointer-events:none;}
  .lod-city .station-hit, .lod-detail .station-hit{ pointer-events:auto; }

  .station-label{
    font-weight:600; fill:var(--ink); opacity:.85;
    paint-order:stroke fill; stroke:#fff; stroke-width:3px; stroke-linejoin:round;
    pointer-events:auto; cursor:pointer; user-select:none; display:none;
  }
  .station-label.terminus{ display:block; font-weight:700; opacity:1; }
  .station-label.terminus.dimmed{ opacity:.15; }
  .lod-city .station-label, .lod-detail .station-label{ display:block; }
  .station-dot.focused{ stroke:#20201c; stroke-opacity:.85; }
  /* stroke-width for .station-dot / .station-dot.focused is set in JS (applyView/updateFocusDots/closePopup),
     scaled by `inv`, so the ring stays visually thin & constant at every zoom level instead of a flat value
     that balloons when zoomed in (bug found 2026-09-26, fixed here — see also v37_selectA.html). */
  .station-dot-inner{ fill:#20201c; opacity:0; pointer-events:none; }
  .station-dot-inner.focused{ opacity:.85; }

  .train{ pointer-events:none; stroke-linecap:round; stroke-linejoin:round; }

  .card{ background:var(--card); border-radius:16px; box-shadow:var(--shadow); }

  /* touch-action:manipulation on every round icon button below (2026-09-27 fix): #mapWrap already has
     touch-action:none so double-tapping the MAP does nothing, but these 4 buttons had no touch-action of
     their own, so a double-tap on any of them (very natural when repeatedly tapping zoom +/- or refresh)
     triggered the browser's native double-tap-to-zoom instead -- viewport's user-scalable=no doesn't
     reliably suppress that on its own, touch-action is what actually does it per-element. */
  #searchIconBtn{
    position:absolute; top:14px; left:14px; z-index:6; width:40px; height:40px; border-radius:50%;
    border:none; background:var(--card); color:var(--ink); box-shadow:var(--shadow); cursor:pointer;
    display:flex; align-items:center; justify-content:center; touch-action:manipulation;
  }
  #searchIconBtn.hidden{ display:none; }

  /* Alerts panel — mirrors the search icon/panel pattern, anchored right */
  #alertsIconBtn{
    position:absolute; top:14px; right:14px; z-index:6; width:40px; height:40px; border-radius:50%;
    border:none; background:var(--card); color:var(--ink); box-shadow:var(--shadow); cursor:pointer;
    display:flex; align-items:center; justify-content:center; touch-action:manipulation;
  }
  #alertsIconBtn.hidden{ display:none; }
  #alertsPanel{
    position:absolute; top:14px; right:14px; z-index:7; width:min(420px, calc(100vw - 28px)); display:none;
    background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:14px 16px;
    max-height:70vh; overflow:auto;
  }
  #alertsPanel.open{ display:block; }
  #alertsPanel .pclose{position:absolute; top:10px; right:12px; cursor:pointer; color:var(--muted); font-size:16px; background:none; border:none;}
  #alertsPanel h3{ margin:0 0 10px; font-size:14px; }
  #alertsPanel .item{ display:flex; gap:8px; padding:8px 0; border-top:1px solid #f2f0e8; font-size:12.5px; line-height:1.4; }
  #alertsPanel .item:first-of-type{ border-top:none; }
  #alertsPanel .item .ic{ flex:0 0 auto; }
  #alertsPanel .empty{ color:var(--muted); font-size:12.5px; }
  #popup .alert-row{ display:flex; gap:8px; align-items:flex-start; background:#fdeaea; color:var(--ink);
    border-radius:10px; padding:8px 10px; font-size:12px; line-height:1.4; margin-bottom:10px; }
  #searchWrap{ position:absolute; top:14px; left:14px; z-index:7; width:min(420px, calc(100vw - 28px)); display:none; }
  #searchWrap.open{ display:block; }
  #searchWrap input{ width:100%; border:none; outline:none; border-radius:14px; padding:11px 14px; font-size:16px; box-shadow:var(--shadow); background:var(--card); color:var(--ink); font-family:inherit; }
  #searchResults{ margin-top:6px; background:var(--card); border-radius:14px; box-shadow:var(--shadow); max-height:46vh; overflow:auto; display:none; }
  #searchResults.open{display:block;}
  #searchResults .item{ padding:10px 14px; font-size:13.5px; cursor:pointer; display:flex; align-items:center; gap:8px; border-bottom:1px solid #f0ede4; }
  #searchResults .item:last-child{border-bottom:none;}
  #searchResults .item:hover{background:#f7f5ee;}
  #searchResults .chip{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}

  /* zoom control lives bottom-right (2026-09-27: moved from bottom-left — the more standard corner for
     map zoom controls, matching Google/Apple/Mapbox conventions), with the refresh button stacked directly
     above it, same right edge, same family as the search/alerts icon buttons above. */
  #zoomCtl{ position:absolute; right:14px; bottom:calc(24px + env(safe-area-inset-bottom)); z-index:5; display:flex; flex-direction:column; overflow:hidden; border-radius:14px; box-shadow:var(--shadow); background:var(--card); }
  #zoomCtl button{ width:42px;height:42px;border:none;background:transparent;font-size:19px;color:var(--ink); cursor:pointer; touch-action:manipulation; }
  #zoomCtl button:first-child{border-bottom:1px solid #f0ede4;}
  #zoomCtl button:active{background:#f3f1e9;}

  #refreshBtn{
    position:absolute; right:14px; bottom:calc(24px + env(safe-area-inset-bottom) + 94px); z-index:5;
    width:40px; height:40px; border-radius:50%; border:none; background:var(--card); color:var(--ink);
    box-shadow:var(--shadow); cursor:pointer; display:flex; align-items:center; justify-content:center;
    touch-action:manipulation;
  }
  #refreshBtn svg{ transition:transform .5s ease; }
  #refreshBtn.spinning svg{ transform:rotate(360deg); }

  #popup{
    position:absolute; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(12px);
    z-index:8; width:min(300px,88vw); padding:14px 16px; opacity:0; pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
  }
  #popup.open{opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto;}
  #popup .pname{font-size:14.5px;font-weight:700;margin:0 0 2px;}
  #popup .pclose{position:absolute; top:10px; right:12px; cursor:pointer; color:var(--muted); font-size:16px; background:none; border:none;}
  #popup .prow{display:flex; align-items:center; gap:8px; font-size:12.5px; padding:5px 0; border-top:1px solid #f2f0e8;}
  #popup .prow:first-of-type{border-top:none; margin-top:8px;}
  #popup .prow .sw{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
  #popup .prow .dest{flex:1;}
  #popup .prow .min{color:var(--muted); font-variant-numeric:tabular-nums;}
  #popup .empty{font-size:12.5px;color:var(--muted);padding:8px 0 2px;}
  #popup .pheading{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:10px 0 2px;}
  #popup .pheading:first-of-type{padding-top:6px;}

</style>
</head>
<body>
<div id="app">
  <div id="mapWrap">
    <svg id="map" viewBox="-60 -80 1240 1340" preserveAspectRatio="xMidYMid meet">
      <g id="lines"></g>
      <g id="trains"></g>
      <g id="stations"></g>
      <g id="stationLabels"></g>
      <g id="hitTargets"></g>
    </svg>
  </div>



  <button id="searchIconBtn" title="Search stations" aria-label="Search stations">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.2" y2="16.2"></line></svg>
  </button>
  <div id="searchWrap">
    <input id="searchInput" type="text" placeholder="Search stations" autocomplete="off">
    <div id="searchResults"></div>
  </div>

  <button id="alertsIconBtn" title="Alerts" aria-label="Alerts">
    <!-- BELL (previous, for easy revert): width/height 19, stroke-width 2.18, path="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" + path="M13.73 21a2 2 0 0 1-3.46 0" -->
    <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.97" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.5 2.7 17a1.6 1.6 0 0 0 1.4 2.4h15.8a1.6 1.6 0 0 0 1.4-2.4L13.7 3.5a1.6 1.6 0 0 0-2.8 0Z"></path><line x1="12" y1="9.5" x2="12" y2="13.2"></line><circle cx="12" cy="16" r="0.15" fill="currentColor"></circle></svg>
  </button>
  <div id="alertsPanel"><button class="pclose" id="alertsPanelClose">×</button><h3>Alerts</h3><div id="alertsList"></div></div>


  <button id="refreshBtn" title="Refresh live data" aria-label="Refresh live data">
    <!-- v38: switched to the double-arrow "sync" glyph (option C) at 16px, was the single clockwise
         arrow at 19px — see chat 2026-09-27 icon comparison. Old icon, for easy revert:
         <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><polyline points="21 3 21 9 15 9"></polyline></svg> -->
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14.5-4.5"></path><polyline points="18.5 3 18.5 7.5 14 7.5"></polyline><path d="M20 12a8 8 0 0 1-14.5 4.5"></path><polyline points="5.5 21 5.5 16.5 10 16.5"></polyline></svg>
  </button>
  <div id="zoomCtl">
    <button id="zoomIn">+</button>
    <button id="zoomOut">–</button>
  </div>

  <div id="popup" class="card">
    <button class="pclose" id="popupClose">×</button>
    <div class="pname" id="popupName"></div>
    <div id="popupBody"></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ===================== MOBILE VIEWPORT HEIGHT FIX =====================
   Mobile browsers resize the visible viewport as the address bar shows/
   hides; `100dvh` alone doesn't cover every browser version, so this sets
   an explicit --vh custom property from the real window.innerHeight and
   keeps it updated. */
function setRealVH(){
  document.documentElement.style.setProperty("--vh", (window.innerHeight*0.01)+"px");
}
setRealVH();
window.addEventListener("resize", setRealVH);
window.addEventListener("orientationchange", setRealVH);

/* ============================= DATA ============================= */

const LINES = {
  orange: { name:"Richmond – Berryessa", color:"#FF8D28",
    stations:["RICH","DELN","PLZA","NBRK","DBRK","ASHB","MCAR","19TH","12TH","LAKE","FTVL","COLS","SANL","BAYF","HAYW","SHAY","UCTY","FRMT","WARM","MLPT","BERY"],
    path:["RICH","DELN","PLZA","NBRK","DBRK","ASHB","Z14","MCAR","19TH","12TH","Z20","LAKE","FTVL","COLS","SANL","BAYF","HAYW","SHAY","AS39","UCTY","FRMT","WARM","MLPT","BERY"] },
  red: { name:"Richmond – Millbrae", color:"#FF383C",
    stations:["RICH","DELN","PLZA","NBRK","DBRK","ASHB","MCAR","19TH","12TH","WOAK","EMBR","MONT","POWL","CIVC","16TH","24TH","GLEN","BALB","DALY","COLM","SSAN","SBRN","SFIA","MLBR"],
    path:["RICH","DELN","PLZA","NBRK","DBRK","ASHB","Z14","MCAR","19TH","12TH","Z20","WOAK","L20","EMBR","MONT","POWL","CIVC","G25","16TH","24TH","GLEN","BALB","G30","DALY","COLM","SSAN","SBRN","SFIA","MLBR"] },
  yellow: { name:"Antioch – Millbrae / SFO", color:"#FFCC00",
    stations:["ANTC","PCTR","PITT","NCON","CONC","PHIL","WCRK","LAFY","ORIN","ROCK","MCAR","19TH","12TH","WOAK","EMBR","MONT","POWL","CIVC","16TH","24TH","GLEN","BALB","DALY","COLM","SSAN","SBRN","SFIA","MLBR"],
    path:["ANTC","PCTR","PITT","NCON","AM1","CONC","PHIL","WCRK","LAFY","ORIN","ROCK","Z14","MCAR","19TH","12TH","Z20","WOAK","L20","EMBR","MONT","POWL","CIVC","G25","16TH","24TH","GLEN","BALB","G30","DALY","COLM","SSAN","SBRN","SFIA","MLBR"] },
  green: { name:"Berryessa – Daly City", color:"#34C759",
    stations:["BERY","MLPT","WARM","FRMT","UCTY","SHAY","HAYW","BAYF","SANL","COLS","FTVL","LAKE","WOAK","EMBR","MONT","POWL","CIVC","16TH","24TH","GLEN","BALB","DALY"],
    path:["BERY","MLPT","WARM","FRMT","UCTY","AS39","SHAY","HAYW","BAYF","SANL","COLS","FTVL","LAKE","Z20","WOAK","L20","EMBR","MONT","POWL","CIVC","G25","16TH","24TH","GLEN","BALB","G30","DALY"] },
  blue: { name:"Dublin/Pleasanton – Daly City", color:"#0088FF",
    stations:["DUBL","WDUB","CAST","BAYF","SANL","COLS","FTVL","LAKE","WOAK","EMBR","MONT","POWL","CIVC","16TH","24TH","GLEN","BALB","DALY"],
    path:["DUBL","WDUB","CAST","AK31","BAYF","SANL","COLS","FTVL","LAKE","Z20","WOAK","L20","EMBR","MONT","POWL","CIVC","G25","16TH","24TH","GLEN","BALB","G30","DALY"] },
  beige: { name:"Oakland Airport Connector", color:"#8E8E93",
    stations:["COLS","OAKL"],
    path:["COLS","OAKL"] }
};

const STATIONS_RAW = [
["RICH","Richmond",37.9366,-122.3535],["DELN","El Cerrito del Norte",37.9257,-122.3172],
["PLZA","El Cerrito Plaza",37.9026,-122.2989],["NBRK","North Berkeley",37.8740,-122.2836],
["DBRK","Downtown Berkeley",37.8697,-122.2679],["ASHB","Ashby",37.8528,-122.2698],
["MCAR","MacArthur",37.8288,-122.2680],["19TH","19th St Oakland",37.8162,-122.2680],
["12TH","12th St Oakland",37.8036,-122.2680],["WOAK","West Oakland",37.8020,-122.2952],
["LAKE","Lake Merritt",37.7950,-122.2600],["FTVL","Fruitvale",37.7746,-122.2241],
["COLS","Coliseum",37.7540,-122.1966],["SANL","San Leandro",37.7219,-122.1611],
["BAYF","Bay Fair",37.6970,-122.1265],["HAYW","Hayward",37.6698,-122.0871],
["SHAY","South Hayward",37.6349,-122.0574],["UCTY","Union City",37.5911,-122.0177],
["FRMT","Fremont",37.5573,-121.9764],["WARM","Warm Springs",37.5024,-121.9391],
["MLPT","Milpitas",37.4106,-121.8916],["BERY","Berryessa/North San Jose",37.3684,-121.8747],
["CAST","Castro Valley",37.6907,-122.0757],["WDUB","West Dublin",37.6996,-121.9282],
["DUBL","Dublin/Pleasanton",37.7018,-121.9001],["ROCK","Rockridge",37.8449,-122.2513],
["ORIN","Orinda",37.8781,-122.1836],["LAFY","Lafayette",37.8933,-122.1245],
["WCRK","Walnut Creek",37.9059,-122.0672],["PHIL","Pleasant Hill",37.9284,-122.0563],
["CONC","Concord",37.9739,-122.0294],["NCON","North Concord",38.0031,-122.0246],
["PITT","Pittsburg/Bay Point",38.0189,-121.9450],["PCTR","Pittsburg Center",38.0186,-121.8853],
["ANTC","Antioch",37.9955,-121.7807],["EMBR","Embarcadero",37.7929,-122.3969],
["MONT","Montgomery St",37.7894,-122.4019],["POWL","Powell St",37.7844,-122.4076],
["CIVC","Civic Center",37.7795,-122.4137],["16TH","16th St Mission",37.7649,-122.4200],
["24TH","24th St Mission",37.7524,-122.4184],["GLEN","Glen Park",37.7331,-122.4339],
["BALB","Balboa Park",37.7217,-122.4475],["DALY","Daly City",37.7061,-122.4692],
["COLM","Colma",37.6844,-122.4661],["SSAN","South San Francisco",37.6642,-122.4440],
["SBRN","San Bruno",37.6377,-122.4165],["SFIA","SFO Airport",37.6159,-122.3925],
["MLBR","Millbrae",37.6003,-122.3867],["OAKL","Oakland Airport",37.7134,-122.2120]
];

const STATIONS = {};
STATIONS_RAW.forEach(function(s){ STATIONS[s[0]] = { id:s[0], name:s[1], lat:s[2], lon:s[3], lines:[] }; });
const LINE_ORDER = ["yellow","orange","red","green","blue","beige"];
LINE_ORDER.forEach(function(lid){
  const seq = LINES[lid].stations;
  seq.forEach(function(sid){ STATIONS[sid].lines.push(lid); });
  // the OAK connector's start (Coliseum) is already a real hub on other lines, not a true system terminus —
  // and its end (Oakland Airport) is a short shuttle stop, not a real terminus either — so beige gets no
  // terminus styling on either end, unlike every other line
  if(lid!=="beige") STATIONS[seq[0]].terminus = true;
  if(lid!=="beige") STATIONS[seq[seq.length-1]].terminus = true;
});

/* ============================= PROJECTION (self-contained, no map tiles) ============================= */

const lats = STATIONS_RAW.map(function(s){return s[2];});
const lons = STATIONS_RAW.map(function(s){return s[3];});
const latMax = Math.max.apply(null, lats), latMin = Math.min.apply(null, lats);
const lonMin = Math.min.apply(null, lons);
const cosLat = Math.cos(((latMin+latMax)/2) * Math.PI/180);
const PAD = 70, VBW = 1300, VBH = 1340;

function rawXY(lat, lon){ return { x:(lon-lonMin)*cosLat, y:(latMax-lat) }; }
let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
STATIONS_RAW.forEach(function(s){ const p=rawXY(s[2],s[3]); if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x; if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y; });
const spanX=maxX-minX, spanY=maxY-minY;
const PSCALE = Math.min((VBW-2*PAD)/spanX, (VBH-2*PAD)/spanY);
const offX = PAD - minX*PSCALE + ((VBW-2*PAD)-spanX*PSCALE)/2;
const offY = PAD - minY*PSCALE + ((VBH-2*PAD)-spanY*PSCALE)/2;
function toXY(lat,lon){ const p=rawXY(lat,lon); return { x:p.x*PSCALE+offX, y:p.y*PSCALE+offY }; }
STATIONS_RAW.forEach(function(s){ const p=toXY(s[2],s[3]); STATIONS[s[0]].x=p.x; STATIONS[s[0]].y=p.y; });
// --- schematic grid override: PDF v2 grid (column letter = x, row number = y, ×20 units) — see
// Notion "Station Coordinates (PDF Grid)". Replaces the old lat/lon-derived approximation entirely;
// every station below is exactly collinear with its neighbors along real corridors. ---
const SCHEMATIC = {
  "12TH":{x:520,y:360}, // was y:380 (row 19) — nudged to row 18 2026-09-19, see note below SCHEMATIC
  "16TH":{x:140,y:520},
  "19TH":{x:520,y:330}, // was y:340 (row 17) — nudged to row 16.5 2026-09-19, see note below SCHEMATIC
  "24TH":{x:140,y:540},
  "ANTC":{x:1080,y:20},
  "ASHB":{x:480,y:240},
  "BALB":{x:140,y:580},
  "BAYF":{x:720,y:600},
  "BERY":{x:900,y:1160},
  "CAST":{x:840,y:620},
  "CIVC":{x:160,y:480},
  "COLM":{x:200,y:660},
  "COLS":{x:640,y:520},
  "CONC":{x:760,y:40},
  "DALY":{x:160,y:620},
  "DBRK":{x:440,y:200},
  "DELN":{x:320,y:80},
  "DUBL":{x:1000,y:620},
  "EMBR":{x:220,y:420},
  "FRMT":{x:900,y:920},
  "FTVL":{x:600,y:480},
  "GLEN":{x:140,y:560},
  "HAYW":{x:820,y:700},
  "LAFY":{x:640,y:160},
  "LAKE":{x:560,y:440},
  "MCAR":{x:520,y:300},
  "MLBR":{x:360,y:820},
  "MLPT":{x:900,y:1080},
  "MONT":{x:200,y:440},
  "NBRK":{x:400,y:160},
  "NCON":{x:840,y:20},
  "OAKL":{x:600,y:560},
  "ORIN":{x:600,y:200},
  "PCTR":{x:1000,y:20},
  "PHIL":{x:720,y:80},
  "PITT":{x:920,y:20},
  "PLZA":{x:360,y:120},
  "POWL":{x:180,y:460},
  "RICH":{x:280,y:40},
  "ROCK":{x:560,y:240},
  "SANL":{x:680,y:560},
  "SBRN":{x:280,y:740},
  "SFIA":{x:320,y:780},
  "SHAY":{x:880,y:760},
  "SSAN":{x:240,y:700},
  "UCTY":{x:900,y:840},
  "WARM":{x:900,y:1000},
  "WCRK":{x:680,y:120},
  "WDUB":{x:920,y:620},
  "WOAK":{x:440,y:400},
};
Object.keys(SCHEMATIC).forEach(function(sid){ if(STATIONS[sid]){ STATIONS[sid].x=SCHEMATIC[sid].x; STATIONS[sid].y=SCHEMATIC[sid].y; } });
// NOTE 2026-09-19: 19TH/12TH are the only two stations NOT on an integer PDF grid row (16.5, 18 instead of
// 17, 19) — a deliberate spacing nudge, not a PDF cell. Old (row 17/19) had MacArthur-19th-12th at even
// 40-unit steps but left 12th only 20 units from the Z20 fork (half the other gaps, visually cramped).

// true corner to round at, instead of the old bug where every real station became a rounding corner.
const WAYPOINTS = {
  "Z14":{x:520,y:280},
  "AM1":{x:780,y:20},
  "Z20":{x:520,y:400},
  "L20":{x:240,y:400}, // was G20 — shifted +5 cols (2026-09-19)

function pt(id){ const s=STATIONS[id]; if(s) return s; const w=WAYPOINTS[id]; if(w) return w; throw new Error("unknown waypoint: "+id); }


function haversineKm(a,b){
  const R=6371, toRad=Math.PI/180;
  const dLat=(b.lat-a.lat)*toRad, dLon=(b.lon-a.lon)*toRad;
  const la1=a.lat*toRad, la2=b.lat*toRad;
  const h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

addCorridor([["RICH","DELN"],["DELN","PLZA"],["PLZA","NBRK"],["NBRK","DBRK"],["DBRK","ASHB"],["ASHB","Z14"],["Z14","MCAR"],["MCAR","19TH"],["19TH","12TH"],["12TH","Z20"]],

// canonicalize direction by real coordinates (not by which node the caller happened to list first) so the
// SAME physical edge always yields the SAME normal, even when two lines walk it in opposite order — e.g.
// orange goes Z20→LAKE while green/blue go LAKE→Z20; without this, that edge's "offset side" flipped
// between them and threw their lanes to the wrong side right at the station (recurring bug #1).
function edgeOffset(lowId,hiId,lid){
  let A=pt(lowId), B=pt(hiId);
  if(A.x>B.x || (A.x===B.x && A.y>B.y)){ const t=A; A=B; B=t; }
  const dx=B.x-A.x, dy=B.y-A.y, len=Math.hypot(dx,dy)||1;
  const nx=-dy/len, ny=dx/len;
  const override = CORRIDOR_LANE[lowId+"|"+hiId];
  const lane = (override && override[lid]!=null) ? override[lid] : LANE[lid];
  return { dx: nx*lane*OFFSET_PX, dy: ny*lane*OFFSET_PX };
}
function lineIntersect(p1,d1,p2,d2){
  const denom = d1.x*d2.y - d1.y*d2.x;
  if(Math.abs(denom) < 1e-6) return null;
  const t = ((p2.x-p1.x)*d2.y - (p2.y-p1.y)*d2.x) / denom;
  return { x: p1.x+d1.x*t, y: p1.y+d1.y*t };
}
// one joint point per WAYPOINT (station or bend) along each line's rendered path — end waypoints use
// their one edge's fixed-lane offset; interior waypoints use the intersection of the incoming/outgoing
// offset lines (a miter join), so consecutive edges always meet exactly with no gap, before rounding.
// Built from LINES[lid].path (stations + the 9 bend cells), NOT the stop list, so the drawn line actually
// bends only at those 9 cells instead of at every station.
function buildJoints(seqOf){
  const joints = {};
  LINE_ORDER.forEach(function(lid){
    const seq = seqOf(lid);
    const pts = [];
    for(let i=0;i<seq.length;i++){
      const cur = pt(seq[i]);
      if(i===0){
        const off = edgeOffset(seq[0], seq[1], lid);
        pts.push({ x:cur.x+off.dx, y:cur.y+off.dy });
      } else if(i===seq.length-1){
        const off = edgeOffset(seq[i-1], seq[i], lid);
        pts.push({ x:cur.x+off.dx, y:cur.y+off.dy });
      } else {
        const prev = pt(seq[i-1]), next = pt(seq[i+1]);
        const offIn = edgeOffset(seq[i-1], seq[i], lid);
        const offOut = edgeOffset(seq[i], seq[i+1], lid);
        const p1 = { x:cur.x+offIn.dx, y:cur.y+offIn.dy }, d1 = { x:cur.x-prev.x, y:cur.y-prev.y };
        const p2 = { x:cur.x+offOut.dx, y:cur.y+offOut.dy }, d2 = { x:next.x-cur.x, y:next.y-cur.y };
        pts.push(lineIntersect(p1,d1,p2,d2) || p1);
      }
    }
    joints[lid] = pts;
  });
  return joints;
}
const lineJoints = buildJoints(function(lid){ return LINES[lid].path; }); // for the drawn line + dots
// (train animation now samples the real rendered <path> via pathLenAt, built further below once the paths
// exist in the DOM — no separate station-only joints structure needed any more)
// build one continuous path per line: straight "L" between stations, but each interior joint is rounded
// by cutting back a small distance on both adjacent edges and connecting with a quadratic bezier (using
// the sharp corner as the control point) — a standard, clean corner-rounding technique.
// shared by both the visual line (roundedPath) and the station dots (dotPositionForStation) so a dot
// always sits exactly on the curve the line actually draws, even right at a rounded bend
function roundedCorner(prev, cur, next, rOverride){
  const dIn = Math.hypot(cur.x-prev.x, cur.y-prev.y)||1;
  const dOut = Math.hypot(next.x-cur.x, next.y-cur.y)||1;
  const r = rOverride!=null ? Math.min(rOverride, dIn*0.45, dOut*0.45) : Math.min(CORNER_RADIUS, dIn*0.45, dOut*0.45);
  const inX = cur.x-(cur.x-prev.x)/dIn*r, inY = cur.y-(cur.y-prev.y)/dIn*r;
  const outX = cur.x+(next.x-cur.x)/dOut*r, outY = cur.y+(next.y-cur.y)/dOut*r;
  // point ON the quadratic bezier at t=0.5 (control point = cur) — the curve does NOT pass through cur
  // itself once rounded, so this is the correct "on the line" position near this station
  const midX = 0.25*inX+0.5*cur.x+0.25*outX, midY = 0.25*inY+0.5*cur.y+0.25*outY;
  return { in:{x:inX,y:inY}, out:{x:outX,y:outY}, mid:{x:midX,y:midY} };
}
// shared corner radius per STATION (not per line/lane) — computed once from the true, un-offset station
// positions, so every line bending together at the same station gets the exact same rounding, instead of
// each lane's own slightly-different offset geometry picking its own radius
function sharedCornerRadius(sid){
  const st = pt(sid);
  const lines = STATIONS[sid] ? STATIONS[sid].lines : LINE_ORDER.filter(function(l){ return LINES[l].path.indexOf(sid)!==-1; });
  if(lines.length<1) return CORNER_RADIUS;
  const lid = lines[0], seq = LINES[lid].path, idx = seq.indexOf(sid);
  if(idx<=0 || idx>=seq.length-1) return CORNER_RADIUS;
  const dIn = Math.hypot(st.x-pt(seq[idx-1]).x, st.y-pt(seq[idx-1]).y)||1;
  const dOut = Math.hypot(pt(seq[idx+1]).x-st.x, pt(seq[idx+1]).y-st.y)||1;
  return Math.min(CORNER_RADIUS, dIn*0.45, dOut*0.45);
}
function roundedPath(pts, seq){
  if(pts.length<2) return "";
  if(pts.length===2) return "M "+pts[0].x.toFixed(1)+" "+pts[0].y.toFixed(1)+" L "+pts[1].x.toFixed(1)+" "+pts[1].y.toFixed(1);
  let d = "M "+pts[0].x.toFixed(1)+" "+pts[0].y.toFixed(1);
  for(let i=1;i<pts.length-1;i++){
    const r = seq ? sharedCornerRadius(seq[i]) : undefined;
    const c = roundedCorner(pts[i-1], pts[i], pts[i+1], r);
    d += " L "+c.in.x.toFixed(1)+" "+c.in.y.toFixed(1);
    d += " Q "+pts[i].x.toFixed(1)+" "+pts[i].y.toFixed(1)+" "+c.out.x.toFixed(1)+" "+c.out.y.toFixed(1);
  }
  d += " L "+pts[pts.length-1].x.toFixed(1)+" "+pts[pts.length-1].y.toFixed(1);
  return d;
}
// the exact position on line lid's rendered curve for the station at this index — endpoints have no
// rounding (use the joint directly); interior stations use the bezier midpoint from roundedCorner above.
// But if every line through this station shares the same previous (or same next) station — i.e. they
// only diverge on ONE side of it — use that SHARED edge's simple offset for all of them instead, so their
// dots line up as one clean row even though the lines themselves fan out after/before this point.
function dotPositionForStation(lid, sid){
  const pts = lineJoints[lid];
  const st = STATIONS[sid];
  const seq = LINES[lid].path;
  const idx = seq.indexOf(sid);
  if(st.lines.length>1){
    // "prevs"/"nexts" here are STOP-adjacency (LINES[l].stations), not path-adjacency — this is
    // deliberately about which real station riders transfer to/from, independent of any bend in between.
    const prevs = st.lines.map(function(l){ const i=LINES[l].stations.indexOf(sid); return i>0?LINES[l].stations[i-1]:null; });
    const nexts = st.lines.map(function(l){ const i=LINES[l].stations.indexOf(sid); return i<LINES[l].stations.length-1?LINES[l].stations[i+1]:null; });
    const sharedPrev = prevs.every(function(p){return p===prevs[0] && p!==null;});
    const sharedNext = nexts.every(function(n){return n===nexts[0] && n!==null;});
    if(sharedPrev && sharedNext){
      // fully identical topology for every line here (e.g. Embarcadero, Daly City) — a per-line bezier
      // offset can skew apart at a sharp bend, so instead compute ONE shared bisector normal from the
      // station's true (un-offset) position and offset each line's dot along that same line, straight —
      // guarantees a clean row regardless of how sharp the turn is.
      // Use the TRUE geometric neighbor (this line's own `.path`, which includes bend waypoints) for the
      // direction math, not the stop-adjacent one — a station one hop from a bend point (e.g. Embarcadero
      // is one hop from L20) has a STOP neighbor (West Oakland) that skips right over that bend, giving a
      // skewed, non-perpendicular angle. `prevs[0]`/`nexts[0]` (STOP-adjacent) are kept only as the
      // CORRIDOR_LANE lookup key's fallback and for the topology check above — the direction itself always
      // uses the real adjacent path point.
      const truePrevId = idx>0 ? seq[idx-1] : prevs[0];
      const trueNextId = idx<seq.length-1 ? seq[idx+1] : nexts[0];
      const offPrev = edgeOffset(truePrevId, sid, lid);
      const offNext = edgeOffset(sid, trueNextId, lid);
      const magPrev = Math.hypot(offPrev.dx, offPrev.dy), magNext = Math.hypot(offNext.dx, offNext.dy);
      const n1 = magPrev>1e-6 ? {x:offPrev.dx/magPrev, y:offPrev.dy/magPrev} : null;
      const n2 = magNext>1e-6 ? {x:offNext.dx/magNext, y:offNext.dy/magNext} : null;
      let bis;
      if(n1 && n2){ bis = {x:n1.x+n2.x, y:n1.y+n2.y}; const bl=Math.hypot(bis.x,bis.y); bis = bl<1e-6 ? n1 : {x:bis.x/bl,y:bis.y/bl}; }
      else bis = n1 || n2 || {x:0,y:0};
      const mag = (magPrev + magNext)/2 || OFFSET_PX;
      return { x:st.x+bis.x*mag, y:st.y+bis.y*mag };
    }
    if(sharedPrev && idx>0){ const off=edgeOffset(seq[idx-1],seq[idx],lid); return {x:st.x+off.dx,y:st.y+off.dy}; }
    if(sharedNext && idx<seq.length-1){ const off=edgeOffset(seq[idx],seq[idx+1],lid); return {x:st.x+off.dx,y:st.y+off.dy}; }
  }
  if(idx<=0 || idx>=pts.length-1) return pts[idx];
  return roundedCorner(pts[idx-1], pts[idx], pts[idx+1]).mid;
}

/* ============================= SVG HELPER ============================= */

const svgNS = "http://www.w3.org/2000/svg";
function el(tag,attrs){ const e=document.createElementNS(svgNS,tag); for(const k in attrs){ e.setAttribute(k,attrs[k]); } return e; }

function lightenHex(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  r = Math.round(r+(255-r)*amt); g = Math.round(g+(255-g)*amt); b = Math.round(b+(255-b)*amt);
  return "#"+[r,g,b].map(function(v){ return v.toString(16).padStart(2,"0"); }).join("");
}

// one dynamic gradient PER TRAIN (not per line) — gradientUnits="userSpaceOnUse" with x1,y1/x2,y2 updated
// every tick to that train's own current tail/head coordinates. A single per-line gradient in the default
// objectBoundingBox units (a fixed horizontal x1=0,x2=1 vector) only fades correctly for a roughly
// horizontal train; on a vertical or diagonal stretch the bounding box's horizontal extent is just the
// stroke width, so the fade collapses to a near-uniform dark blob instead of a head→tail gradient. Tying
// the gradient vector to the train's real tail→head points fixes this at any orientation.
const trainDefs = el("defs", {});
document.getElementById("map").insertBefore(trainDefs, document.getElementById("map").firstChild);
function makeTrainGradient(key, color){
  const grad = el("linearGradient", { id:"trainGrad-"+key, gradientUnits:"userSpaceOnUse", x1:"0", y1:"0", x2:"1", y2:"0" });
  grad.appendChild(el("stop", { offset:"0%", "stop-color":color, "stop-opacity":"0.30" }));
  grad.appendChild(el("stop", { offset:"100%", "stop-color":color, "stop-opacity":"1.0" }));
  trainDefs.appendChild(grad);
  return grad;
}

/* ============================= LINES — one continuous rounded path per line ============================= */

const linesG = document.getElementById("lines");
const linePathEls = {}; // lid -> single path element
const lineHitEls = {}; // lid -> invisible wide-stroke path used only for tap/click hit-testing
const THIN_FACTOR = 0.22; // thin rails, but each line keeps its own color (v37b: circles' thin form + real line colors)
LINE_ORDER.forEach(function(lid){
  const d = roundedPath(lineJoints[lid], LINES[lid].path);
  const path = el("path", {
    d:d, class:"line-path", stroke:lightenHex(LINES[lid].color, 0.2),
    "stroke-width": LINE_WEIGHT*THIN_FACTOR
  });
  linesG.appendChild(path);
  linePathEls[lid] = [path];

  // v37b: the visible rail is thin, but the tappable area should stay as forgiving as v36's full line
  // thickness (easy to hit on mobile without zooming in) — an invisible, wider stroke on top of the same
  // path handles hit-testing (pointer-events:stroke lets it catch taps even though it paints nothing).
  const hit = el("path", {
    d:d, class:"line-hit", stroke:"#000", "stroke-opacity":"0",
    "stroke-width": LINE_WEIGHT, fill:"none", "pointer-events":"stroke"
  });
  hit.addEventListener("click", function(e){ e.stopPropagation(); setSolo(lid); });
  hit.style.cursor = "pointer";
  linesG.appendChild(hit);
  lineHitEls[lid] = hit;
});

// length-along-path (in SVG user units) of every waypoint (station or bend) on each line's real rendered
// curve — built once here via getPointAtLength/getTotalLength, so train animation can later sample the
// TRUE curve (lane offset + rounded corners, exactly as drawn) instead of a straight station-to-station hop.
// Two-phase per line: (1) sample the whole path at fine, fixed resolution once (cheap — a few thousand
// native getPointAtLength calls), (2) for each waypoint in path order, scan forward from the previous
// waypoint's sample for the nearest sample, then refine locally for sub-pixel precision. A pure binary
// search over the whole remaining range isn't safe here — distance-to-target isn't unimodal on a path this
// long (it can dip near a WRONG far-away point before rising again), so it can converge to the wrong spot.
const pathLenAt = {};
LINE_ORDER.forEach(function(lid){
  const el0 = linePathEls[lid][0];
  const total = el0.getTotalLength();
  const seq = LINES[lid].path;
  const STEP = Math.max(0.5, total/2000);
  const samples = [];
  for(let L=0; L<=total; L+=STEP){ const p = el0.getPointAtLength(L); samples.push({L:L,x:p.x,y:p.y}); }
  if(samples[samples.length-1].L < total){ const p = el0.getPointAtLength(total); samples.push({L:total,x:p.x,y:p.y}); }
  const table = {};
  let searchIdx = 0;
  seq.forEach(function(wid){
    const target = pt(wid);
    let bestIdx = searchIdx, bestD = Infinity;
    for(let i=searchIdx;i<samples.length;i++){
      const s = samples[i];
      const d = (s.x-target.x)*(s.x-target.x) + (s.y-target.y)*(s.y-target.y);
      if(d<bestD){ bestD=d; bestIdx=i; }
    }
    // local refine around the best sample for sub-pixel precision
    let lo = samples[Math.max(0,bestIdx-1)].L, hi = samples[Math.min(samples.length-1,bestIdx+1)].L;
    for(let iter=0; iter<20; iter++){
      const m1 = lo + (hi-lo)/3, m2 = hi - (hi-lo)/3;
      const p1 = el0.getPointAtLength(m1), p2 = el0.getPointAtLength(m2);
      const d1 = (p1.x-target.x)*(p1.x-target.x)+(p1.y-target.y)*(p1.y-target.y);
      const d2 = (p2.x-target.x)*(p2.x-target.x)+(p2.y-target.y)*(p2.y-target.y);
      if(d1<d2) hi = m2; else lo = m1;
    }
    const L = (lo+hi)/2;
    table[wid] = L;
    searchIdx = bestIdx;
  });
  pathLenAt[lid] = { table:table, total:total };
});

const stationsG = document.getElementById("stations");
const stationLabelsG = document.getElementById("stationLabels");
const hitG = document.getElementById("hitTargets");

// rough center of the whole system, used so labels default to the outward/open side rather than the

Object.keys(STATIONS).forEach(function(sid){ cxSum+=STATIONS[sid].x; cySum+=STATIONS[sid].y; cCount++; });
const NET_CENTER = { x:cxSum/cCount, y:cySum/cCount };

function localDirection(sid, lid){
  const seq = LINES[lid].path;
  const idx = seq.indexOf(sid);
  const joints = lineJoints[lid];

// themselves are actually spread along, whatever that is (vertical, horizontal, or a 45° diagonal).
function stationPerpVec(sid){
  const st = STATIONS[sid];
  const isHub = st.lines.length>1;
  let dir;

  // same 3-click zoom-in: v36's dot rendered ~35px across vs v37's ~21px, so DOTR_MAX is picked to close

    try{ mapWrap.setPointerCapture(e.pointerId); }catch(err){}
    dragging=true; lastX=e.clientX; lastY=e.clientY; mapWrap.classList.add("dragging");
  } else if(activePointers.size===2){
    try{ mapWrap.setPointerCapture(e.pointerId); }catch(err){}
    dragging=false;
    const pts = Array.from(activePointers.values());
    pinchStartDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y) || 1;
    pinchStartScale = view.scale;
    const mid = pinchMidpoint();
    pinchAnchorSvg = clientToSvg(mid.x, mid.y);
  }
});
mapWrap.addEventListener("pointermove", function(e){
  if(!activePointers.has(e.pointerId)) return;
  activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(activePointers.size>=2 && pinchStartDist){
    const pts = Array.from(activePointers.values()).slice(0,2);
    const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y) || 1;
    view.scale = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, pinchStartScale*(dist/pinchStartDist)));
    const mid = pinchMidpoint();
    anchorViewTo(pinchAnchorSvg, mid.x, mid.y);
    applyView();
    return;
  }
  if(!dragging){
    // a single pointer that started on a tappable element (line/station/label) and hasn't been promoted
    // to a drag yet — promote it once it's moved enough to clearly be a pan, not a tap.
    if(activePointers.size===1 && Math.hypot(e.clientX-dragStartX, e.clientY-dragStartY)>6){
      try{ mapWrap.setPointerCapture(e.pointerId); }catch(err){}
      dragging=true; dragMoved=true; lastX=e.clientX; lastY=e.clientY; mapWrap.classList.add("dragging");
    }
    return;
  }
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  if(Math.hypot(e.clientX-dragStartX, e.clientY-dragStartY)>6) dragMoved=true;
  const rect = mapWrap.getBoundingClientRect();
  const k = (BASE_VB.w/view.scale)/rect.width;
  view.tx += dx*k; view.ty += dy*k;
  lastX=e.clientX; lastY=e.clientY;
  applyView();
});
function endPointer(e){
  activePointers.delete(e.pointerId);
  if(activePointers.size<2){ pinchStartDist = null; }
  if(activePointers.size===1){
    const remaining = Array.from(activePointers.values())[0];
    dragging = true; lastX = remaining.x; lastY = remaining.y;
  } else if(activePointers.size===0){
    dragging = false; mapWrap.classList.remove("dragging");
  }
}
["pointerup","pointerleave","pointercancel"].forEach(function(ev){ mapWrap.addEventListener(ev, endPointer); });

// No real BART service-advisory feed (BSA) is wired up -- that would need a separate endpoint. But we
// don't need one to answer "shouldn't a suspended line show an alert?" (asked 2026-09-27, after confirming
// live that Green had zero real estimates system-wide while Red was running fine): fetchETD already knows,
// every cycle, exactly which lines have ANY real train reported anywhere on the whole system. If a line has
// zero real estimates while we're successfully in liveMode (i.e. this isn't just "BART's API is down",
// since OTHER lines are fine), that is itself alert-worthy -- computeLiveAlerts() below derives that
// directly from the real data instead of waiting on a separate advisory feed. DEMO_ALERTS stays as a manual
// override list (empty by default) for the rare case someone wants to add a one-off note by hand.
const DEMO_ALERTS = [];
let liveAlerts = [];
// Schedule-based closures (e.g. Green Line's weekday-only hours) are expected, not a service problem -- per
// user request 2026-09-27, these no longer appear in the global alert button/panel at all (a dot + icon
// there reads like something is wrong, when it's just the normal published schedule). They're kept in this
// separate list and shown ONLY inline in the popup of a station that line actually serves.
let scheduleClosures = [];
function activeAlerts(){ return DEMO_ALERTS.concat(liveAlerts); }
// Known, fixed BART schedule rules (published service patterns, not derived from live data) -- asked for
// 2026-09-27 so a line with zero live data can be explained as "this is normal, it just doesn't run right
// now by schedule" instead of the vaguer "may be suspended or delayed." Green Line (Berryessa <-> Daly City)
// is currently a weekday commute-hours-only line with no weekend or evening service, which is exactly why it
// shows zero estimates on a Sunday -- that's expected, not an outage.
const SCHEDULE_RULES = {
  green: {
    weekdayOnly: true,
    commuteHoursOnly: true,
    // roughly BART's published AM/PM commute windows; used only to decide which message to show, not to
    // hide/show trains -- live data always wins if trains actually appear outside these hours.
    startHour: 5, endHour: 21,
    note: "Green Line runs on weekdays during commute hours only — no weekend or evening service."
  }
};
function scheduleNote(lid){
  const rule = SCHEDULE_RULES[lid];
  if(!rule) return null;
  const now = new Date();
  const day = now.getDay(); // 0=Sun .. 6=Sat
  const hour = now.getHours();
  const isWeekend = day===0 || day===6;
  const outsideHours = hour<rule.startHour || hour>=rule.endHour;
  if(rule.weekdayOnly && isWeekend) return rule.note;
  if(rule.commuteHoursOnly && !isWeekend && outsideHours) return rule.note;
  return null;
}
function computeLiveAlerts(){
  if(!liveMode){ liveAlerts = []; scheduleClosures = []; return; }
  const seenLines = {};
  Object.keys(etdByStation).forEach(function(sid){
    etdByStation[sid].forEach(function(e){ seenLines[e.lineId] = true; });
  });
  liveAlerts = [];
  scheduleClosures = [];
  Object.keys(LINES).filter(function(lid){ return lid!=="beige" && !seenLines[lid]; }).forEach(function(lid){
    const note = scheduleNote(lid);
    if(note){
      // expected, by-schedule closure -- popup-only, not a global alert (see scheduleClosures above)
      scheduleClosures.push({ id:"sched-"+lid, type:"cancel", scope:"line", lineId:lid, text:note });
    } else {
      liveAlerts.push({ id:"live-"+lid, type:"delay", scope:"line", lineId:lid,
        text:"No live train data right now — service may be suspended or delayed." });
    }
  });
}
// "cancel" = a red no-entry circle with a horizontal white bar (⛔) -- used for "this genuinely isn't
// running right now" (a by-schedule closure, or the Oakland Connector outside its hours), never for a real
// service problem. "delay" = a warning triangle (⚠️) -- reserved for an unexpected zero-data line, i.e. an
// actual possible service issue, which is why it's the one that still surfaces in the global alert panel.
function alertIcon(type){ return type==="cancel" ? "⛔" : "⚠️"; }
function alertsForStation(sid){
  const fromActive = activeAlerts().filter(function(a){
    if(a.scope==="station") return a.stationId===sid;
    if(a.scope==="line") return STATIONS[sid].lines.indexOf(a.lineId)!==-1;
    return false;
  });
  const fromSchedule = scheduleClosures.filter(function(a){
    return a.scope==="line" && STATIONS[sid].lines.indexOf(a.lineId)!==-1;
  });
  return fromActive.concat(fromSchedule);
}
function renderAlertsPanel(){
  const list = document.getElementById("alertsList");
  const alerts = activeAlerts();
  list.innerHTML = alerts.length ? alerts.map(function(a){
    // For a line-scope alert, lead with a colored dot in the line's own color plus its plain color name
    // only (e.g. "Green Line") -- previously this appended the route name in parens ("Green Line
    // (Berryessa - Daly City)"), which read like the alert itself was titled "Berryessa and Daly City" --
    // confusing as a section header. Fixed 2026-09-27 per user report: just the color name identifies which
    // line on the map this is about, nothing more is needed in the header.
    const lineChip = a.scope==="line" ? '<span class="chip" style="background:'+LINES[a.lineId].color+';display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;"></span>' : '';
    const scopeLabel = a.scope==="line" ? (a.lineId.charAt(0).toUpperCase()+a.lineId.slice(1)+" Line")
      : (a.scope==="station" ? STATIONS[a.stationId].name : "Systemwide");
    return '<div class="item"><span class="ic">'+alertIcon(a.type)+'</span><div><strong>'+lineChip+scopeLabel+'</strong><br>'+a.text+'</div></div>';
  }).join("") : '<div class="empty">No active alerts.</div>';
  alertsIconBtn.classList.toggle("hidden", !alerts.length);
}
const alertsIconBtn = document.getElementById("alertsIconBtn");
const alertsPanel = document.getElementById("alertsPanel");

// BART's real-time ETD API has NO data at all for the Oakland Airport Connector -- confirmed 2026-09-27
// by querying BART directly: COLS's own destination list never includes "Oakland Airport", and OAKL's own
// ETD query comes back with an explicit "No data matched your criteria." This isn't just missing GPS
// position -- there's no next-departure time, no wait estimate, nothing to compute an animated train from.
// So instead of a live "X min" row (which we have no data for), show BART's own published schedule --
// but still react to the actual current time, the way a real live row would, rather than one fixed
// sentence always shown the same way regardless of whether the connector is even running right now:
// - during its published operating hours: just the frequency ("Every 4-5 min"), like a live status
// - outside those hours: "Not running right now" plus when it starts back up
const OAK_HOURS_BY_DAY = { 0:[8,24], 6:[6,24] }; // Sun, Sat -- weekdays (1-5) default to [5,24] below
function oakHoursForDay(day){ return OAK_HOURS_BY_DAY[day] || [5,24]; }
function formatHour12(h){
  const hh = ((h%24)+24)%24;
  const period = hh<12 ? "AM" : "PM";
  let disp = hh%12; if(disp===0) disp = 12;
  return disp+" "+period;
}
function oakScheduleText(){
  const now = new Date();
  const [start, end] = oakHoursForDay(now.getDay());
  const hour = now.getHours();
  // No trailing period -- matches the style of a real row's minutes field ("4 min"), which never ends in
  // punctuation either, so this reads as one more field in that field, not a separate sentence.
  if(hour<start || hour>=end) return "Not running — starts "+formatHour12(start);
  return "Every 4–5 min";
}
function renderPopupBody(sid){
  const st = STATIONS[sid];
  const alertHtml = alertsForStation(sid).map(function(a){
    return '<div class="alert-row"><span>'+alertIcon(a.type)+'</span><span>'+a.text+'</span></div>';
  }).join("");
  const rows = etdByStation[sid]||[];
  // Formatted as a normal destination row (swatch + dest + gray min-style field), matching every other
  // line's rows, instead of one hand-written sentence -- per user request 2026-09-27. "Oakland Airport
  // Shuttle" as the section header (not just "Oakland Airport", which read like a destination, not a
  // section) and the row's own destination is the OTHER end of the shuttle from wherever this popup is.
  const oakDest = sid==="COLS" ? "Oakland Airport" : "Coliseum";
  const oakScheduleHtml = '<div class="pheading">Oakland Airport Shuttle</div><div class="prow">'+
    '<span class="sw" style="background:'+LINES.beige.color+'"></span>'+
    '<span class="dest">'+oakDest+'</span><span class="min">'+oakScheduleText()+'</span></div>';
  if(sid==="OAKL"){ popupBody.innerHTML = alertHtml + oakScheduleHtml; return; }
  if(!rows.length){ popupBody.innerHTML=alertHtml+'<div class="empty">No upcoming trains right now.</div>'+(sid==="COLS"?oakScheduleHtml:""); return; }
  const row = function(e){
    return '<div class="prow"><span class="sw" style="background:'+LINES[e.lineId].color+'"></span>'+
      '<span class="dest">'+e.destination+'</span><span class="min">'+e.minutesLabel+'</span></div>';
  };
  // A true terminus (e.g. Richmond, Antioch, Dublin/Pleasanton, Berryessa, Millbrae) naturally has only
  // ONE direction of real travel, so it doesn't need a special case here -- the grouping logic below
  // (same one every other station uses) simply never populates the OTHER direction's group for it, and
  // the single populated group renders with the same pheading + max-2-rows format as everywhere else.
  // (Previously had a separate branch here that skipped the direction header and showed up to 8 rows for
  // any non-through station -- removed 2026-09-27 per user request: Richmond was losing its direction
  // label and showing 5 rows instead of the normal 2-per-direction format for no real reason.)
  // Which compass pair applies (N/S vs E/W) is a real-world geographic property of where this station's
  // track physically runs — NOT simply "has orange or not". Two lineless-of-orange segments can point
  // opposite ways in reality: the Rockridge/Concord trunk genuinely runs east (confirmed against BART's own
  // usage — "Eastbound train leaving Rockridge"), while the Montgomery–SFO peninsula trunk genuinely runs
  // north/south (BART's own official detailed map labels the Daly City transfer "TIMED TRANSFER NORTHBOUND/
  // SOUTHBOUND"). So the axis is computed once per station from its REAL lat/lon neighbors (not the
  // schematic's artistic x/y, which deliberately distorts angles to 45°/90°), then each row's own
  // destination lat/lon decides which end of that axis it's heading toward.
  // Which compass pair applies (N/S vs E/W) is mostly determined by whether orange serves the station —
  // any station orange touches sits on the shared Richmond↔Berryessa trunk, which is a real north-south
  // corridor system-wide. The one real exception: the SF Peninsula trunk south of Civic Center carries no
  // orange service but is genuinely north-south in reality (BART's own official detailed map labels the
  // Daly City transfer "TIMED TRANSFER NORTHBOUND/SOUTHBOUND") — a purely local real-lat/lon bearing check
  // was tried and rejected here: immediate-neighbor geography is noisy (e.g. Bay Fair's real neighbors jog
  // east-west even though the whole corridor it's on reads north-south), so this is an explicit exception
  // list instead, matching what's actually confirmed against BART's own usage.
  const PENINSULA_NS = new Set(["MONT","POWL","CIVC","16TH","24TH","GLEN","BALB","DALY","COLM","SSAN","SBRN","SFIA","MLBR"]);
  const axisNS = st.lines.indexOf("orange")!==-1 || PENINSULA_NS.has(sid);
  // WHICH end of the axisNS/E-W axis a row is heading toward used to be decided by comparing the FAR
  // terminus's coordinates to this station's -- wrong whenever the route bends between here and there.
  // e.g. a Dublin-bound blue train leaving 16th St first heads back up through Civic Center (genuinely
  // NORTH), even though Dublin itself sits far to the south/east on the map -- this showed Dublin-bound
  // trains as "Southbound" at 16th St (confirmed as a real bug 2026-09-27, reported by user). Fixed by
  // comparing this station's REAL lat/lon to its IMMEDIATE NEXT real stop toward that destination
  // (nextStopToward), not to the destination itself -- that one hop's direction is always locally correct
  // no matter how the route curves further out. Also switched from the schematic's distorted x/y to real
  // lat/lon for this comparison (the schematic deliberately draws everything at 45°/90° angles, which was
  // already noted above as wrong for this purpose but never actually fixed until now).
  // (12th St/Lake Merritt's West Oakland-bound trains were briefly split into their own 3rd "Westbound"
  // group to patch around this same underlying bug -- reverted 2026-09-27 per user request: every station
  // now shows a simple 2-group North/South (or East/West) split, same as everywhere else. The destination
  // name on each row already tells you which physical train it is, so a 3rd bucket isn't needed for that.)
  function nextStopToward(lid, fromSid, destSid){
    const seq = LINES[lid].stations, oi = seq.indexOf(fromSid), di = seq.indexOf(destSid);
    if(oi===-1) return null;
    const sign = (di!==-1 && di!==oi) ? (di>oi?1:-1) : (oi===0?1:-1);
    const ni = oi+sign;
    return (ni>=0 && ni<seq.length) ? seq[ni] : null;
  }
  const groups = {};
  rows.forEach(function(e){
    let g;
    if(e.lineId==="beige") g="Oakland Airport";
    else {
      const d = STATIONS[e.destSid];
      // defensive: a real-API destination string that findDestSid() couldn't resolve (unexpected BART
      // naming) used to crash here (reading .lat off undefined) and silently kill the whole popup, even
      // though the station dot had already been marked focused a moment earlier — see Known Bugs. Now it
      // just drops this one row instead of aborting renderPopupBody entirely.
      if(!d) return;
      const nextId = nextStopToward(e.lineId, sid, e.destSid);
      const n = (nextId && STATIONS[nextId]) || d;
      g = axisNS ? (n.lat > st.lat ? "Northbound" : "Southbound") : (n.lon > st.lon ? "Eastbound" : "Westbound");
      // Embarcadero is the hinge point right before the peninsula's north/south corridor starts (its very
      // next stop, Montgomery, is already labeled that way) — so its peninsula-bound direction reads
      // "Southbound" here too, instead of "Westbound", to stay consistent with where it's actually heading.
      if(sid==="EMBR" && g==="Westbound") g="Southbound";
    }
    (groups[g] = groups[g]||[]).push(e);
  });
  const order = sid==="EMBR" ? ["Eastbound","Southbound","Oakland Airport"]
    : axisNS ? ["Northbound","Southbound","Oakland Airport"] : ["Westbound","Eastbound","Oakland Airport"];
  let html = "";
  order.forEach(function(g){
    if(g==="Oakland Airport"){
      // groups["Oakland Airport"] will never actually get populated (see oakScheduleText note above --
      // BART's live data never includes a beige row), so show the schedule text unconditionally at COLS
      // instead of only when groups[g] happens to exist.
      if(sid==="COLS") html += oakScheduleHtml;
      return;
    }
    if(!groups[g]) return;
    const list = groups[g].sort(function(a,b){ return a.minutesNum-b.minutesNum; }).slice(0,2);
    html += '<div class="pheading">'+g+'</div>' + list.map(row).join("");
  });
  popupBody.innerHTML = alertHtml + html;
}

/* ============================= LIVE DATA ============================= */

const COLOR_TO_LINE = { ORANGE:"orange", RED:"red", YELLOW:"yellow", GREEN:"green", BLUE:"blue", BEIGE:"beige" };
// Real BART ETD data is fetched through our own /api/etd serverless function (see /api/etd.js), which
// calls api.bart.gov server-side and relays the JSON back. api.bart.gov does not send CORS headers, so a
// direct browser fetch to it is blocked by the browser regardless of https vs file:// — a server-side
// proxy is required, not just an https host. (Fixed 2026-09-27: this used to hit api.bart.gov directly
// from the client, which silently failed CORS on every host and always fell back to simulateETD().)
const ETD_URL = "/api/etd";

let etdByStation = {};
let liveMode = false;

function minutesToLabel(v){ return v==="Leaving" ? "Leaving" : v+" min"; }
function minutesToNum(v){ if(v==="Leaving") return 0.4; const n=parseFloat(v); return isNaN(n)?null:n; }
// Fallback text-matcher used only when BART's own `abbreviation` field (see resolveDestSid below) is
// missing -- resolves a real BART API destination string (e.g. "Warm Springs/ South Fremont", "SFO/
// Millbrae", "Antioch") to one of our station ids, GLOBALLY across all stations.
// Real API rows need this because, unlike simulateETD()'s synthetic rows, BART only gives us a display
// name, not a station id — and renderPopupBody's direction grouping (Northbound/Southbound/etc.) requires
// a real station id (destSid) to compare coordinates against. Missing this caused a hard crash in
// renderPopupBody for every through-station once live data was flowing (fixed 2026-09-27 — see Known Bugs).
// UNIFIED DESTINATION RESOLUTION (2026-09-27, reported by user -- "노란색 밀브레행 트레인 하나도 안 뜨는데
// 정보도 안 나오고, 열차는 보이는데 역 정보에는 안 뜨는 경우도 있다"): confirmed against BART's real live feed
// that this had TWO separate causes. (1) BART's real destination TEXT is genuinely messy/inconsistent --
// e.g. the actual live text is "SF Airport" (no "O"), not "SFO Airport" as assumed -- so the token
// matcher's own first-word gate (nmTok[0]="sfo" must appear in destTok) silently REJECTED it and returned
// null, which is exactly why some real yellow-line trains showed neither a map marker nor popup info: this
// wasn't a rendering bug, it was destSid resolution failing on real BART wording no one had tested against.
// (2) the map (buildTrainMeta, via its own findDestIndex text-matcher) and the popup (via findDestSid, a
// separate text-matcher) used to run TWO INDEPENDENT resolutions of the same destination text -- so a
// wording quirk that broke one but not the other produced exactly "train visible on the map but missing
// from that station's popup" (or vice versa), because the two paths could disagree with each other.
// Fixed properly, not by patching more special cases into the text matcher: BART's real API already
// includes a machine-readable `etd.abbreviation` field with the exact destination station code (confirmed
// live -- e.g. destination:"SF Airport" always comes with abbreviation:"SFIA", destination:"SFO/Millbrae"
// with abbreviation:"MLBR"). resolveDestSid() below uses that directly whenever it's a valid station code,
// and only falls back to the fuzzy name-token matcher for the rare case it's missing (e.g. simulateETD()'s
// synthetic rows, which invent destination text but no abbreviation). Both fetchETD (which builds the
// popup's rows) and buildTrainMeta (which places map markers) now call the SAME function and store the SAME
// resolved id on the row (row.destSid) -- there is only one destSid per row now, computed once, so the map
// and the popup can no longer disagree about what a row's destination actually is.
function resolveDestSid(destText, abbreviation){
  if(abbreviation && STATIONS[abbreviation]) return abbreviation;
  return findDestSid(destText);
}
// Both destination-lookups below used to do a raw substring test (dl.indexOf(nmFirst)), which broke on
// two kinds of real BART text: (1) a station's first word can occur as a plain SUBSTRING inside another
// station's name with no word boundary at all -- "san" (San Leandro's first word) sits right inside
// "pleaSANton", so a real "Dublin/Pleasanton" destination silently resolved to San Leandro, which is what
// caused West Dublin/Castro Valley's Eastbound/Westbound to look swapped (fixed 2026-09-27, see Known
// Bugs); (2) a genuinely shared whole WORD ("North" in both "North Berkeley" and "Berryessa/North San
// Jose", "Bay" in both "Bay Fair" and "Pittsburg/Bay Point") still matches multiple stations even with
// word-boundary tokenizing alone, and the first one in STATIONS' key order silently won regardless of fit.
// Fixed by scoring every candidate: how many of the CANDIDATE's own name-tokens actually appear in the
// destination text (as whole tokens, not substrings), and taking the best-covered candidate instead of the
// first name-token match found. A station whose full name exactly reappears in the text (the normal case --
// BART's real destination strings are usually a close variant of the terminus's own name) always outscores
// one that only shares a single incidental word.
function nameTokens(s){ return s.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean); }
// Both functions used to hard-return SFIA/OAKL the moment destText contained "sfo" or "airport", BEFORE
// the token-scoring logic below ever ran. That always won even when the real text was "SFO/Millbrae" --
// BART legitimately short-turns some yellow-line trips at SFO and continues others to Millbrae, so that
// text should resolve to MLBR (the true terminus for that trip), not always SFIA (fixed 2026-09-27, see
// Known Bugs). Removed: the token scorer below already handles every real case correctly on its own --
// "SFO/Millbrae" scores MLBR higher (its whole name "millbrae" is one token, a full-coverage match) than
// SFIA (only "sfo" matches, "airport" doesn't appear in the text) -- and a bare "SFO Airport" (no Millbrae
// mentioned) still scores SFIA correctly since SFIA's own tokens ["sfo","airport"] are both present.
// "Oakland International Airport" -> OAKL falls out the same way (both of OAKL's tokens match), so that
// shortcut was equally unnecessary. Verified with a standalone Node test against these exact strings.
function findDestSid(destText){
  if(!destText) return null;
  const destTok = nameTokens(destText);
  let best = null, bestScore = -1;
  Object.keys(STATIONS).forEach(function(sid){
    const nmTok = nameTokens(STATIONS[sid].name);
    if(destTok.indexOf(nmTok[0])===-1) return; // station's own first word must appear as a whole token
    const matched = nmTok.filter(function(t){ return destTok.indexOf(t)!==-1; }).length;
    const score = matched*1000 + matched/nmTok.length;
    if(score>bestScore){ best=sid; bestScore=score; }
  });
  return best;
}

let trainMeta = {};
// BART's own ETD minutes is "time until arrival AT sid" -- for a train more than one hop out (common once
// fetchETD keeps all of BART's real estimates, not just the soonest), the old version only ever checked the
// single immediately-adjacent hop and silently dropped anything farther, which is why a station could show
// e.g. 3 real upcoming trains on one line while the map only ever drew 1. Fixed 2026-09-27: walk backward
// hop-by-hop, subtracting each hop's real travel time, until the remaining minutes land inside one hop --
// that hop becomes the train's actual prevId/sid pair, however many stations back that turns out to be.
//
// DUPLICATE MARKERS (found + fixed 2026-09-27, reported by user): the walk-back above is done once per
// REPORTING station, but BART's ETD reports the SAME physical train from every station along its approach
// simultaneously (each with a proportionally different minutes-to-arrival for that platform, sometimes
// 3-4 stations upstream). The old version keyed each computed placement by the reporting station
// (sid+lid+destination+idx), so one real train reported by several upstream stations produced that many
// separate map markers, all landing on the same or a near-identical hop -- this is the "너무 많이 보여,
// 중복" the user saw, not a calculation error.
// First attempt at a fix grouped placements by their computed final hop (line+prevId+sid) and clustered by
// the hop-local `remaining` minutes -- but that is NOT robust: the backward walk-back above can land on a
// DIFFERENT hop for two reports of the very same train, purely because each report starts its walk from a
// different `m` and the per-hop time estimate (haversine distance / 0.9, clamped 1-6 min) doesn't divide
// evenly, so small rounding differences between stations' reports compound over 2-3 hops and tip the walk
// into the neighboring hop's bucket -- verified this actually happens with realistic numbers (train 2 min
// from 12th St, 5 min from West Oakland, 11 min from Embarcadero -- physically one train, but two of those
// three land one hop apart after backward-walking). Fixed properly by computing, for every report, a single
// robust "total minutes until arrival at the FINAL destination" (sum every hop's time from the reporting
// station all the way to the destination, no backward walk, no early-break) -- that total is an invariant
// of the physical train and comes out the same (within rounding) no matter which station along the route
// reported it. Group by line+destination, cluster by that total (~2 min tolerance) to collapse the same
// train's multiple reports into one, then take the report closest to arrival (smallest raw minutesNum --
// the most current estimate) as the representative and use ONLY that one's already-correct backward-walked
// prevId/sid/hopMin/remaining for where to actually draw it on the map.
function pathTimeMin(seq, fromIdx, toIdx){
  if(fromIdx===toIdx) return 0;
  const sign = toIdx>fromIdx ? 1 : -1;
  let total = 0, i = fromIdx, guard = 0;
  while(i!==toIdx && guard<60){
    guard++;
    total += Math.max(1, Math.min(6, haversineKm(STATIONS[seq[i]], STATIONS[seq[i+sign]])/0.9));
    i += sign;
  }
  return total;
}
function buildTrainMeta(){
  const now = Date.now();
  const placements = [];
  Object.keys(etdByStation).forEach(function(sid){
    etdByStation[sid].forEach(function(e){
      const lid = e.lineId;
      const seq = LINES[lid] && LINES[lid].stations;
      if(!seq) return;
      const oi = seq.indexOf(sid);
      if(oi===-1) return;
      // di now comes from the SAME resolved destSid the popup uses (e.destSid, see resolveDestSid above) --
      // no more separate text-matching pass here that could disagree with the popup's.
      let di = e.destSid ? seq.indexOf(e.destSid) : -1;
      let sign = 1;
      if(di!==-1 && di!==oi) sign = di>oi?1:-1; else sign = oi===0?1:-1;
      const m = e.minutesNum;
      if(m==null) return;
      const totalToDest = m + pathTimeMin(seq, oi, di!==-1 ? di : (sign===1 ? seq.length-1 : 0));
      const rank = e.rank==null ? 0 : e.rank;
      let remaining = m, curIdx = oi, prevIdx = oi-sign, hopMin = null, guard = 0;
      // sid can BE the line's own origin terminus (e.g. a Millbrae-bound yellow train reported directly at
      // ANTC, yellow's own first station) -- there is no station "before" it on this line to walk back
      // into, so the very first prevIdx is out of range immediately (guard never even runs once). The old
      // code just `return`ed here, silently dropping every train still sitting at (or just leaving) its own
      // origin terminus -- confirmed live 2026-09-27: real ANTC/PCTR "SFO/Millbrae" rows were exactly this
      // case, which is why Millbrae-bound yellow trains showed no map marker even though the popup had the
      // info (the popup's data doesn't go through this walk-back at all, only the map does). Fixed: when
      // there's truly no earlier station on this line, just place the train at sid itself (a zero-length
      // hop) instead of dropping it -- it renders sitting at that station's dot, which is honest given we
      // have no finer-grained position for a train still at its own origin.
      // 2026-09-28: this zero-length prevId===sid placement was rendering as a FULL-SIZE train-shaped
      // gradient stroke sitting exactly on top of the station dot -- indistinguishable from a real moving
      // train that had frozen mid-track. Confirmed live: BART keeps reporting a small/decreasing "next
      // departure" countdown for a dwelling train over several consecutive 15s fetches (real layover time
      // before it turns back), so this same degenerate placement kept regenerating fetch after fetch with
      // zero visual change -- looked exactly like a stuck bug (reported by user at Berryessa/Daly City/
      // Millbrae, though it's symmetric and can happen at any of the 6 real line termini, not just those
      // three -- just a live-data-timing coincidence which ones showed it at the time). Still marking it
      // dwelling:true instead of dropping the placement (dropping it was the OLDER bug -- see history above
      // this block -- it made trains sitting at their own origin invisible entirely). tick() now renders a
      // dwelling train as a small static dot instead of the elongated moving-train stroke, so it reads as
      // "waiting to depart" rather than "broken train frozen on the tracks".
      if(prevIdx<0 || prevIdx>=seq.length){
        placements.push({ lineId:lid, destination:e.destination, rank:rank, prevId:seq[oi], sid:seq[oi], minutesAtFetch:Math.min(m,1), hopMin:1, totalToDest:totalToDest, m:m, dwelling:true });
        return;
      }
      while(prevIdx>=0 && prevIdx<seq.length && guard<40){
        guard++;
        hopMin = Math.max(1, Math.min(6, haversineKm(STATIONS[seq[prevIdx]], STATIONS[seq[curIdx]])/0.9));
        const nextPrevIdx = prevIdx-sign;
        if(remaining<=hopMin*1.4 || nextPrevIdx<0 || nextPrevIdx>=seq.length) break;
        remaining -= hopMin;
        curIdx = prevIdx;
        prevIdx = nextPrevIdx;
      }
      if(prevIdx<0||prevIdx>=seq.length||hopMin==null) return;
      placements.push({ lineId:lid, destination:e.destination, rank:rank, prevId:seq[prevIdx], sid:seq[curIdx], minutesAtFetch:remaining, hopMin:hopMin, totalToDest:totalToDest, m:m });
    });
  });
  // Grouping strictly by (line, destination, rank) -- tried 2026-09-27 -- turned out to UNDER-count on a
  // long route: BART's estimate array is rank-ordered per REPORTING STATION, not system-wide, so "rank 0 at
  // station A" and "rank 0 at station B" are only the same physical train if that train hasn't yet passed
  // whichever of A/B is farther down the line. Confirmed against real captured Red-line data (2026-09-27):
  // Red's Richmond<->Millbrae route takes ~100 real minutes end-to-end (seen directly in the totalToDest
  // spread below) with a 20-min headway, so ~5 distinct trains are in transit each direction at once --
  // grouping by rank alone (only 2-3 ranks tracked) collapsed multiple genuinely different trains together
  // and under-counted (reported "too few trains" 2026-09-27).
  //
  // Back to clustering on totalToDest (m + a crude haversine-distance/0.9-km-per-min hop-time estimate to
  // the destination), which IS a valid same-train test for reports from stations close enough together that
  // the model's error stays small -- the problem before was a flat +-2min tolerance, too tight once that
  // crude model's error accumulates over 20+ hops on a long route. Since real distinct trains are spaced
  // ~one headway apart in totalToDest by definition, using HALF the line's own published headway as the
  // tolerance (HEADWAY_BY_LINE, defined below) absorbs that accumulated drift while still being tight enough
  // to never merge two genuinely different trains (which are never closer than one full headway apart).
  // Verified against real Red-line data: this now finds 6 clusters per direction (matching the ~100min /
  // 20min headway math), instead of 32 (flat +-2min, drift-broken) or 2 (rank-only, position-blind).
  const byLineDest = {};
  placements.forEach(function(p){
    const key = p.lineId+"|"+p.destination;
    (byLineDest[key] = byLineDest[key]||[]).push(p);
  });
  const meta = {};
  Object.keys(byLineDest).forEach(function(key){
    const lid = key.split("|")[0];
    const tol = (HEADWAY_BY_LINE[lid]||20) * 0.5;
    const list = byLineDest[key].slice().sort(function(a,b){ return a.totalToDest-b.totalToDest; });
    let clusterRep = null, clusterIdx = 0;
    list.forEach(function(p){
      if(!clusterRep || p.totalToDest-clusterRep.totalToDest>tol){
        clusterIdx++;
        clusterRep = p;
      } else if(p.m<clusterRep.m){
        clusterRep = p; // a report closer to arrival is more current -- use its (more accurate) placement
      }
      meta[key+"|"+clusterIdx] = { lineId:clusterRep.lineId, prevId:clusterRep.prevId, sid:clusterRep.sid, minutesAtFetch:clusterRep.minutesAtFetch, hopMin:clusterRep.hopMin, fetchTime:now, dwelling:!!clusterRep.dwelling };
    });
  });
  const shuttle = buildOakShuttleMeta(now);
  if(shuttle) meta["beige|shuttle"] = shuttle;
  trainMeta = meta;
}

// BART's live data has nothing at all to place a real Oakland Airport Connector marker from (see
// oakScheduleText above) -- but the user still wants SOMETHING moving on that short line, estimated purely
// from BART's own published frequency (about every 4-5 min) rather than left blank. This is explicitly an
// ESTIMATE, not a live-tracked train: it computes a deterministic back-and-forth cycle from wall-clock time
// alone (a fresh shuttle "departs" every OAK_HEADWAY_MIN minutes, alternating direction each departure, and
// takes OAK_HOP_MIN minutes to cross between COLS and OAKL), so different viewers loading the page at the
// same moment see the same animated shuttle, without ever claiming it's real-time. Returns null outside the
// connector's own published operating hours (oakHoursForDay) so nothing animates when it isn't running.
const OAK_HEADWAY_MIN = 4.5; // BART's own published average wait
const OAK_HOP_MIN = 1.5; // estimated one-way crossing time (not a real timed measurement)
function buildOakShuttleMeta(now){
  const d = new Date(now);
  const [start, end] = oakHoursForDay(d.getDay());
  const hour = d.getHours();
  if(hour<start || hour>=end) return null;
  const headwayMs = OAK_HEADWAY_MIN*60000;
  const cycleIdx = Math.floor(now/headwayMs);
  const phase = (now%headwayMs)/headwayMs; // 0..1 through the current headway cycle
  const hopFrac = OAK_HOP_MIN/OAK_HEADWAY_MIN; // portion of the cycle actually spent crossing
  if(phase>hopFrac) return null; // this cycle's shuttle already arrived -- nothing to animate until the next one
  const minutesAtFetch = OAK_HOP_MIN*(1-phase/hopFrac); // countdown remaining in this crossing
  const forward = cycleIdx%2===0; // alternate direction each departure, like a real back-and-forth shuttle
  return forward
    ? { lineId:"beige", prevId:"COLS", sid:"OAKL", minutesAtFetch:minutesAtFetch, hopMin:OAK_HOP_MIN, fetchTime:now }
    : { lineId:"beige", prevId:"OAKL", sid:"COLS", minutesAtFetch:minutesAtFetch, hopMin:OAK_HOP_MIN, fetchTime:now };
}

async function fetchETD(){
  try{
    const ctrl = new AbortController();
    const t = setTimeout(function(){ctrl.abort();}, 7000);
    const res = await fetch(ETD_URL, {signal:ctrl.signal});
    clearTimeout(t);
    if(!res.ok) throw new Error("bad status");
    const data = await res.json();
    const stationsArr = (data.root && data.root.station) || [];
    const next = {};
    stationsArr.forEach(function(st){
      const sid = st.abbr;
      if(!STATIONS[sid]) return;
      const rows = [];
      (st.etd||[]).forEach(function(etd){
        // Keep ALL of BART's real upcoming-train estimates per line/destination here (was capped to 2, to
        // match the popup's own "max 2 per direction" display rule -- but that cap belongs to the POPUP's
        // rendering, not to this shared data pool: buildTrainMeta needs every available estimate (BART
        // gives up to 3) to correctly cluster trains by headway on a long route (2026-09-27 fix -- see
        // buildTrainMeta). The popup still independently slices to 2 when it renders its own rows below.
        (etd.estimate||[]).forEach(function(est, rank){
          const lid = COLOR_TO_LINE[(est.color||"").toUpperCase()];
          if(!lid) return;
          // rank is no longer used for train-identity matching (see buildTrainMeta) but is kept as a cheap
          // tie-breaker / diagnostic field.
          rows.push({ lineId:lid, destSid:resolveDestSid(etd.destination, etd.abbreviation), destination:etd.destination, minutesLabel:minutesToLabel(est.minutes), minutesNum:minutesToNum(est.minutes), rank:rank });
        });
      });
      next[sid]=rows;
    });
    etdByStation = next;
    liveMode = true;
    buildTrainMeta();
  }catch(err){
    liveMode = false;
    simulateETD();
    simulateTrainMeta();
  }
  computeLiveAlerts();
  renderAlertsPanel();
  setStatus(liveMode);
  if(focusedStation) renderPopupBody(focusedStation);
}

function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return Math.abs(h); }
function simulateETD(){
  const next = {}; const now = Date.now();
  Object.keys(STATIONS).forEach(function(sid){
    const st = STATIONS[sid];
    const rows = [];
    st.lines.forEach(function(lid){
      const seq = LINES[lid].stations;
      const oi = seq.indexOf(sid);
      [0,1].forEach(function(dir){
        const termIdx = dir===0 ? seq.length-1 : 0;
        const pi = dir===0 ? oi-1 : oi+1;
        if(oi===termIdx){
          // this station IS the terminus for this direction — there's no "previous stop" to hop a train
          // in from (that's what used to silently produce zero rows here). Model it as a scheduled
          // departure instead, using the line's real headway, heading toward the OTHER end of the line.
          const headway = HEADWAY_BY_LINE[lid] || 20;
          const span = headway*60000;
          const phase = hashStr(sid+lid+dir+"dep") % span;
          const pos = (now+phase) % span;
          const m = Math.max(0.3, headway*(1-pos/span));
          const otherEndIdx = dir===0 ? 0 : seq.length-1;
          const destSid = seq[otherEndIdx];
          rows.push({ lineId:lid, destSid:destSid, destination:STATIONS[destSid].name, minutesLabel:(m<1?"Leaving":Math.round(m)+" min"), minutesNum:m });
          return;
        }
        if(pi<0||pi>=seq.length) return;
        const hopMin = Math.max(1, Math.min(6, haversineKm(STATIONS[seq[pi]], st)/0.9));
        const span = hopMin*1.3*60000;
        const phase = hashStr(sid+lid+dir) % span;
        const pos = (now+phase) % span;
        const m = Math.max(0.3, hopMin*1.3*(1-pos/span));
        rows.push({ lineId:lid, destSid:seq[termIdx], destination:STATIONS[seq[termIdx]].name, minutesLabel:(m<1?"Leaving":Math.round(m)+" min"), minutesNum:m });
      });
    });
    next[sid]=rows;
  });
  etdByStation = next;
}

const HEADWAY_BY_LINE = { yellow:10, orange:20, red:20, green:20, blue:20, beige:20 }; // BART's own published
                                                                                        // typical frequency per line
function lineDirectionHops(lid, forward){
  const seq = LINES[lid].stations;
  const order = forward ? seq : seq.slice().reverse();
  const hops = [];
  for(let i=0;i<order.length-1;i++){
    const hopMin = Math.max(1, Math.min(6, haversineKm(STATIONS[order[i]], STATIONS[order[i+1]])/0.9));
    hops.push({ prevId:order[i], sid:order[i+1], hopMin:hopMin });
  }
  return hops;
}
// demo mode used to put a synthetic train on every single block of every line at once — unrealistic and
// way too busy. Instead simulate a handful of actual trips per line/direction, spaced at BART's real
// published headway, each taking the full line's travel time to cross — matches what you'd actually see.
function simulateTrainMeta(){
  const meta = {};
  const now = Date.now();
  const nowMin = now/60000;
  LINE_ORDER.forEach(function(lid){
    const headway = HEADWAY_BY_LINE[lid] || 20;
    [true,false].forEach(function(forward){
      const hops = lineDirectionHops(lid, forward);
      if(!hops.length) return;
      const totalT = hops.reduce(function(s,h){ return s+h.hopMin; }, 0);
      const n = Math.max(1, Math.round(totalT/headway));
      const phase = hashStr(lid+forward) % 1000;
      for(let k=0;k<n;k++){
        const elapsed = (nowMin+phase+k*headway) % totalT;
        let acc=0, chosen=null, intoHop=0;
        for(let i=0;i<hops.length;i++){
          if(elapsed < acc+hops[i].hopMin){ chosen=hops[i]; intoHop=elapsed-acc; break; }
          acc += hops[i].hopMin;
        }
        if(!chosen) continue;
        const minutesNum = Math.max(0.2, chosen.hopMin-intoHop);
        const key = lid+"|"+(forward?"f":"b")+"|"+k;
        meta[key] = { lineId:lid, prevId:chosen.prevId, sid:chosen.sid, minutesAtFetch:minutesNum, hopMin:chosen.hopMin, fetchTime:now };
      }
    });
  });
  trainMeta = meta;
}

function setStatus(live){
