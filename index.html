}

/* ============================= TRAINS — v2's shape: a single gradient rect, opaque head fading to a
   transparent tail, now colored per line and riding the exact bezier curve its line is drawn on ============================= */

const trainsG = document.getElementById("trains");
const trainMarkers = {};

function refreshTrainFilter(){
  Object.keys(trainMarkers).forEach(function(k){
    trainMarkers[k].el.style.display = (soloLines && soloLines.indexOf(trainMarkers[k].lineId)===-1) ? "none" : "";
  });
}

function tick(){
  const now = Date.now();
  const st = styleForScale(view.scale);
  const inv = 1/view.scale;
  const activeKeys = {};
  Object.keys(trainMeta).forEach(function(key){
    const m = trainMeta[key];
    activeKeys[key]=true;
    const lineEl = linePathEls[m.lineId][0];
    const total = pathLenAt[m.lineId].total;
    const table = pathLenAt[m.lineId].table;
    const Lprev = table[m.prevId], Lcur = table[m.sid];
    if(Lprev==null || Lcur==null) return;
    const elapsedMin = (now-m.fetchTime)/60000;
    const curMin = Math.max(0, m.minutesAtFetch-elapsedMin);
    const frac = Math.max(0, Math.min(1, 1-(curMin/m.hopMin)));
    // v37b: same visual thickness the circle used (st.dotR is the station radius; trains ran ~1.7x that
    // as a radius, so *2 for diameter), now stretched into a head→tail gradient trail — length = 2x its
    // own thickness — colored in the train's own line color, riding the thin colored rail.
    // TRAIN-FIX (2026-09-26): at low zoom (scale near ZOOM_MIN=1) this raw formula makes trainW bigger, in
    // real map units, than the fixed geometric gap between adjacent parallel lines (OFFSET_PX-based) — so
    // neighboring trains visually overlap/bleed into each other at the DEFAULT zoom even though they don't
    // once zoomed in to scale=4 (already looked right there). `Math.min(1, view.scale/4)` leaves scale>=4
    // completely unchanged and tapers the thickness down further the closer scale gets to 1, so trains stay
    // clear of their neighbors at every zoom level, not just the higher ones.
    // The Oakland Airport Connector (beige) is a small 2-car cable shuttle, not a full BART train -- drawing
    // it at the same thickness/length as a real train (e.g. Red/Yellow) overstates it, since it's really
    // just going straight back and forth between two stations. Scale it down visually (thinner + shorter)
    // so it reads as a shuttle, not a full train.
    // A "dwelling" placement (m.dwelling, see buildTrainMeta) has prevId===sid -- a train still sitting at
    // its own line's origin terminus, not yet under way -- so Lprev===Lcur always and there's no real hop
    // to stretch a trail across. Depending on where that terminus happens to fall in the path's own length
    // table (length 0 vs length `total`), the old lineLen-based stretch either clamped to a single point by
    // accident (Lprev===0, tailLen went negative and got clamped back to 0 -- looked fine by luck) or drew a
    // full-size train-shaped segment sitting dead still at the OTHER terminus (Lprev===total, nothing to
    // clamp against) -- confirmed live 2026-09-28 at Berryessa/Daly City/Millbrae, reported by user as a
    // "stuck" train. Force lineLen to ~0 for dwelling placements so it always collapses to the same small
    // round dot (round line-cap on .train already makes a zero-length stroke render as a circle) regardless
    // of which end of the path table it lands on -- reads as "waiting to depart", not a frozen moving train.
    const isShuttle = m.lineId==="beige";
    const trainW = st.dotR * inv * 1.7 * 2 * Math.min(1, view.scale/4) * (isShuttle ? 0.55 : 1);
    const lineLen = m.dwelling ? 0.01 : trainW * (isShuttle ? 1.6 : 2.5);
    const dir = Lcur>=Lprev ? 1 : -1;
    const headLen = Lprev + frac*(Lcur-Lprev);
    const tailLen = headLen - dir*lineLen;
    const SAMPLES = 10;
    let d = "", tailP = null, headP = null;
    for(let i=0;i<=SAMPLES;i++){
      const L = Math.max(0, Math.min(total, tailLen + (headLen-tailLen)*(i/SAMPLES)));
      const p = lineEl.getPointAtLength(L);
      if(i===0) tailP = p;
      if(i===SAMPLES) headP = p;
      d += (i===0 ? "M " : " L ") + p.x.toFixed(2) + " " + p.y.toFixed(2);
    }

    let rec = trainMarkers[key];
    if(!rec){
      const grad = makeTrainGradient(key, LINES[m.lineId].color);
      const path = el("path", { class:"train", fill:"none", stroke:"url(#trainGrad-"+key+")" });
      trainsG.appendChild(path);
      rec = trainMarkers[key] = { el:path, grad:grad, lineId:m.lineId, expiring:null };
    }
    rec.grad.setAttribute("x1", tailP.x.toFixed(2)); rec.grad.setAttribute("y1", tailP.y.toFixed(2));
    rec.grad.setAttribute("x2", headP.x.toFixed(2)); rec.grad.setAttribute("y2", headP.y.toFixed(2));
    rec.expiring = null;
    rec.el.style.opacity = "";
    rec.el.setAttribute("d", d);
    rec.el.setAttribute("stroke-width", trainW.toFixed(2));
    if(soloLines) rec.el.style.display = (soloLines.indexOf(rec.lineId)===-1) ? "none" : "";
  });
  Object.keys(trainMarkers).forEach(function(k){
    if(activeKeys[k]) return;
    const rec = trainMarkers[k];
    if(rec.expiring==null) rec.expiring = now;
    const elapsed = now-rec.expiring;
    if(elapsed>900){ rec.el.remove(); delete trainMarkers[k]; }
    else{ rec.el.style.opacity = String(Math.max(0,1-elapsed/900)); }
  });
  requestAnimationFrame(tick);
}

/* ============================= BOOT ============================= */

fetchETD();
setInterval(fetchETD, 15000);
setInterval(function(){ if(!liveMode){ simulateETD(); simulateTrainMeta(); } }, 5000);
requestAnimationFrame(tick);

})();
</script>
